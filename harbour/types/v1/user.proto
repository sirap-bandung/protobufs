syntax = "proto3";

package harbour.types.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message User {
  int64 id = 1;
  string username = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9-_]+$" // all lower with nums, dash, and hyphen
  ];
  string email = 3 [(buf.validate.field).string.email = true];
  string display_name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
  string phone_number = 5 [(buf.validate.field).string.pattern = '^\\+[1-9]\\d{1,14}$']; // https://stackoverflow.com/questions/6478875/regular-expression-matching-e-164-formatted-phone-numbers
  bool two_factor_required = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_logged_in = 8;
}

message UserReference {
  int64 id = 1;
  string username = 2;
}
